  rag_nexus_francais_quatrieme_tc: true
  rag_nexus_francais_seconde_tc: true
  rag_nexus_maths_premiere_gen_specialite: true
  rag_nexus_maths_quatrieme_tc: true
  rag_nexus_maths_seconde_tc: true
  rag_nexus_maths_terminale_gen_specialite: true
  rag_nexus_pc_terminale_specialite: true
