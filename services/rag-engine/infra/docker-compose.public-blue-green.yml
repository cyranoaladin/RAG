# Overlay du candidat de recherche publique. Toujours combiner avec
# docker-compose.v2.yml sous un projet Compose explicite distinct de `infra`.
# NEXUS_RELEASE_MATERIAL_ROOT désigne une copie immuable et vérifiée du SHA
# final, jamais un checkout Git ou un lien `current` mutable.
services:
  pgvector:
    volumes: !override
      - rag_pgvector_data:/var/lib/postgresql/data
      - ${NEXUS_RELEASE_MATERIAL_ROOT:?artefacts scelles requis}/postgres/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ${NEXUS_RELEASE_MATERIAL_ROOT:?artefacts scelles requis}/postgres/migrations/003_profile_filtering.sql:/docker-entrypoint-initdb.d/01_003_profile_filtering.sql:ro
      - ${NEXUS_RELEASE_MATERIAL_ROOT:?artefacts scelles requis}/postgres/migrations/004_artifact_placements.sql:/docker-entrypoint-initdb.d/02_004_artifact_placements.sql:ro
      - ${NEXUS_RELEASE_MATERIAL_ROOT:?artefacts scelles requis}/postgres/migrations/005_official_snapshot_currentness.sql:/docker-entrypoint-initdb.d/03_005_official_snapshot_currentness.sql:ro
      - ${NEXUS_RELEASE_MATERIAL_ROOT:?artefacts scelles requis}/postgres/register_bootstrap_migrations.sh:/docker-entrypoint-initdb.d/04_register_bootstrap_migrations.sh:ro
      - ${NEXUS_RELEASE_MATERIAL_ROOT:?artefacts scelles requis}/postgres/provision_runtime_roles.sh:/docker-entrypoint-initdb.d/05_provision_runtime_roles.sh:ro
      - ${NEXUS_RELEASE_MATERIAL_ROOT:?artefacts scelles requis}/postgres/migrations:/docker-entrypoint-migrations:ro
      - ${NEXUS_RELEASE_MATERIAL_ROOT:?artefacts scelles requis}/postgres/healthcheck.sh:/docker-entrypoint-healthcheck.sh:ro
      - ${NEXUS_RELEASE_MATERIAL_ROOT:?artefacts scelles requis}/scripts/lib/pgvector_migration_state.sh:/pgvector-migration-state.sh:ro
      - ${NEXUS_RELEASE_MATERIAL_ROOT:?artefacts scelles requis}/postgres/schema_head_005_fingerprints.env:/schema-head-005-fingerprints.env:ro
      - ${NEXUS_RELEASE_MATERIAL_ROOT:?artefacts scelles requis}/postgres/schema_head_005_columns.tsv:/schema-head-005-columns.tsv:ro
    # Administration de la DB par `docker compose exec` dans ce seul projet.
    ports: !override []

  ingestor:
    build: !reset null
    image: ${NEXUS_INGESTOR_IMAGE_DIGEST:?image API par digest requise}
    volumes: !override
      - ${NEXUS_RELEASE_MATERIAL_ROOT:?artefacts scelles requis}/configs:/app/configs:ro
      - ${NEXUS_RELEASE_MATERIAL_ROOT:?artefacts scelles requis}/release:/app/release:ro
      - ${NEXUS_RELEASE_MATERIAL_ROOT:?artefacts scelles requis}/servable-corpus:/app/servable-corpus:ro
      - ${NEXUS_RUNTIME_SECRETS_ROOT:?secrets runtime requis}/api-clients.json:/app/api-clients/api-clients.json:ro
      - ${NEXUS_RELEASE_MATERIAL_ROOT:?artefacts scelles requis}/models/e5-large:/models/e5-large:ro
      - ${NEXUS_RELEASE_MATERIAL_ROOT:?artefacts scelles requis}/models/reranker:/models/reranker:ro
    ports: !override
      - 127.0.0.1:${NEXUS_SEARCH_PORT:?port API du candidat requis}:8001

  prometheus:
    volumes: !override
      - ${NEXUS_RELEASE_MATERIAL_ROOT:?artefacts scelles requis}/prometheus/prometheus.v2.yml:/etc/prometheus/prometheus.yml:ro
      - ${NEXUS_RELEASE_MATERIAL_ROOT:?artefacts scelles requis}/prometheus/rules:/etc/prometheus/rules:ro
      - rag_prometheus_data:/prometheus
    ports: !override
      - 127.0.0.1:${NEXUS_PROM_PORT:?port Prometheus du candidat requis}:9090
