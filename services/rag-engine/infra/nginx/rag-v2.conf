# RAG Engine v2 — proxy strict du runtime lecture/revue LOT41U.

upstream rag_api {
    server 127.0.0.1:${NGINX_API_PORT};
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=api_v2:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=readiness_v2:10m rate=30r/s;

server {
    listen 443 ssl http2;
    server_name ${RAG_API_EXTERNAL_DOMAIN};

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none';" always;

    location = /health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://rag_api;
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
    }

    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://rag_api;
        proxy_http_version 1.1;
    }

    location = /search/v2 {
        limit_req zone=api_v2 burst=60 nodelay;
        proxy_pass http://rag_api;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location = /corpora/servable/v1 {
        limit_req zone=api_v2 burst=60 nodelay;
        proxy_pass http://rag_api;
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
    }

    location ~ ^/corpora/servable/v1/[0-9a-f]{64}$ {
        limit_req zone=api_v2 burst=60 nodelay;
        proxy_pass http://rag_api;
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
    }

    location = /chat {
        limit_req zone=api_v2 burst=60 nodelay;
        proxy_pass http://rag_api;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location = /collections/v2 {
        limit_req zone=api_v2 burst=60 nodelay;
        proxy_pass http://rag_api;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location = /catalogue/v2 {
        limit_req zone=api_v2 burst=60 nodelay;
        proxy_pass http://rag_api;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location = /collections/readiness {
        limit_req zone=readiness_v2 burst=60 nodelay;
        proxy_pass http://rag_api;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location = /review/v2/queue {
        limit_req zone=api_v2 burst=30 nodelay;
        proxy_pass http://rag_api;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location = /review/v2/decide {
        limit_req zone=api_v2 burst=15 nodelay;
        proxy_pass http://rag_api;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location = /ingest {
        return 410;
    }
    location ^~ /ingest/ {
        return 410;
    }
    location = /search {
        return 410;
    }
    location ^~ /search/ {
        return 410;
    }
    location ^~ /admin {
        return 410;
    }
    location ^~ /stats {
        return 410;
    }
    location ^~ /eval {
        return 410;
    }
    location ^~ /kb {
        return 410;
    }
    location ^~ /rag {
        return 410;
    }

    location / {
        return 404;
    }
}
