networks:
  rag_net:
    driver: bridge

volumes:
  rag_pgvector_data:
  rag_prometheus_data:
  # LOT44f (ADR-0031) : stockage des artefacts bruts téléchargés par le
  # worker d'ingestion gouvernée — jamais partagé avec rag_pgvector_data
  # (ce n'est pas une donnée PostgreSQL) ni exposé à un autre service.
  rag_ingestion_artifacts_data:

services:
  pgvector:
    image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGVECTOR_DB:-ragdb}
      POSTGRES_USER: ${PGVECTOR_USER:-raguser}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:?PGVECTOR_PASSWORD requis}
      PGVECTOR_RETRIEVAL_USER: ${PGVECTOR_RETRIEVAL_USER:-rag_reader}
      PGVECTOR_RETRIEVAL_PASSWORD: ${PGVECTOR_RETRIEVAL_PASSWORD:?PGVECTOR_RETRIEVAL_PASSWORD requis}
      PGVECTOR_REVIEW_USER: ${PGVECTOR_REVIEW_USER:-rag_reviewer}
      PGVECTOR_REVIEW_PASSWORD: ${PGVECTOR_REVIEW_PASSWORD:?PGVECTOR_REVIEW_PASSWORD requis}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - rag_pgvector_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ./postgres/migrations/003_profile_filtering.sql:/docker-entrypoint-initdb.d/01_003_profile_filtering.sql:ro
      - ./postgres/register_bootstrap_migrations.sh:/docker-entrypoint-initdb.d/02_register_bootstrap_migrations.sh:ro
      - ./postgres/provision_runtime_roles.sh:/docker-entrypoint-initdb.d/03_provision_runtime_roles.sh:ro
      - ./postgres/migrations:/docker-entrypoint-migrations:ro
      - ./postgres/healthcheck.sh:/docker-entrypoint-healthcheck.sh:ro
      - ./postgres/schema_head_003_fingerprints.env:/schema-head-003-fingerprints.env:ro
      - ./postgres/schema_head_003_columns.tsv:/schema-head-003-columns.tsv:ro
    ports:
      - "127.0.0.1:${PGVECTOR_PORT:-5435}:5432"
    networks: [rag_net]
    healthcheck:
      test: ["CMD", "bash", "/docker-entrypoint-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  ingestor:
    build:
      context: ../../..
      dockerfile: services/rag-engine/infra/Dockerfile.ingestor-v2
    restart: unless-stopped
    depends_on:
      pgvector:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      RAG_ENV: production
      RAG_ENGINE_CONFIG_DIR: /app/configs
      PG_RAG_DSN: "${PG_RAG_DSN:?PG_RAG_DSN requis (role SELECT)}"
      PG_REVIEW_DSN: "${PG_REVIEW_DSN:?PG_REVIEW_DSN requis (role review limite)}"
      PG_POOL_MIN_SIZE: "${PG_POOL_MIN_SIZE:-1}"
      PG_POOL_MAX_SIZE: "${PG_POOL_MAX_SIZE:-10}"
      PG_POOL_TIMEOUT_S: "${PG_POOL_TIMEOUT_S:-1.0}"
      PG_CONNECT_TIMEOUT_S: "${PG_CONNECT_TIMEOUT_S:-1}"
      PG_STATEMENT_TIMEOUT_MS: "${PG_STATEMENT_TIMEOUT_MS:-3000}"
      PG_LOCK_TIMEOUT_MS: "${PG_LOCK_TIMEOUT_MS:-500}"
      PG_DATABASE_BUDGET_MS: "${PG_DATABASE_BUDGET_MS:-6000}"
      EMBED_MODEL: intfloat/multilingual-e5-large
      EMBED_DIM: "1024"
      RAG_EMBEDDING_MODEL_CACHE_DIR: /models/e5-large
      RAG_EMBEDDING_MODEL_INVENTORY_SHA256: "${RAG_EMBEDDING_MODEL_INVENTORY_SHA256:?empreinte SHA-256 externe de l inventaire embedding requise}"
      RAG_MIGRATIONS_DIR: /app/migrations
      RAG_SCHEMA_HEAD_FINGERPRINTS: /app/schema_head_003_fingerprints.env
      RAG_SCHEMA_HEAD_COLUMNS: /app/schema_head_003_columns.tsv
      RAG_RERANKER_MODEL_CACHE_DIR: /models/reranker
      RAG_RERANKER_MODEL_INVENTORY_SHA256: "${RAG_RERANKER_MODEL_INVENTORY_SHA256:?empreinte SHA-256 externe de l inventaire reranker requise}"
      RERANK_CACHE_TTL: "${RERANK_CACHE_TTL:-300}"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      RAG_MIN_COLLECTION_SUBSTANCE_CHUNKS: "${RAG_MIN_COLLECTION_SUBSTANCE_CHUNKS:-1}"
      RAG_BFF_SERVICE_TOKEN: "${RAG_BFF_SERVICE_TOKEN:?RAG_BFF_SERVICE_TOKEN requis}"
      NEXUS_INTERNAL_TOKEN_SECRET: "${NEXUS_INTERNAL_TOKEN_SECRET:?NEXUS_INTERNAL_TOKEN_SECRET requis}"
      NEXUS_INTERNAL_TOKEN_ISSUER: "${NEXUS_INTERNAL_TOKEN_ISSUER:?NEXUS_INTERNAL_TOKEN_ISSUER requis}"
      NEXUS_INTERNAL_TOKEN_AUDIENCE: "${NEXUS_INTERNAL_TOKEN_AUDIENCE:?NEXUS_INTERNAL_TOKEN_AUDIENCE requis}"
      NEXUS_SSO_ISSUER: "${NEXUS_SSO_ISSUER:?NEXUS_SSO_ISSUER requis}"
      NEXUS_SSO_AUDIENCE: "${NEXUS_SSO_AUDIENCE:?NEXUS_SSO_AUDIENCE requis}"
      METRICS_ENABLED: "${METRICS_ENABLED:-true}"
      XDG_CACHE_HOME: /tmp
    volumes:
      - ${RAG_CONFIGS_HOST_DIR:-../configs}:/app/configs:ro
      - ${RAG_EMBEDDING_MODEL_ARTIFACT_HOST_DIR:-./data/.no-model-cache}:/models/e5-large:ro
      - ${RAG_RERANKER_MODEL_ARTIFACT_HOST_DIR:-./data/.no-model-cache}:/models/reranker:ro
    ports:
      - "127.0.0.1:${INGESTOR_PORT:-8001}:8001"
    networks: [rag_net]
    # Le registre Prometheus est process-local : un seul worker canonique.
    # La capacité se scale par réplicas derrière un agrégateur, pas par fork local.
    command: uvicorn api_v2:app --host 0.0.0.0 --port 8001 --workers 1
    read_only: true
    tmpfs: ["/tmp", "/app/.cache", "/var/tmp"]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 8G

  prometheus:
    image: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    restart: unless-stopped
    depends_on:
      ingestor:
        condition: service_healthy
    volumes:
      - ./prometheus/prometheus.v2.yml:/etc/prometheus/prometheus.yml:ro
      - rag_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19091}:9090"
    networks: [rag_net]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ─────────────────────────────────────────────────────────────────────
  # LOT44f (ADR-0031) : plan de contrôle d'ingestion gouvernée — additions
  # pures, aucune modification des trois services ci-dessus. Schéma logique
  # séparé sur la même instance PostgreSQL que `pgvector` (décision D1,
  # LOT44b) : pas de conteneur PostgreSQL supplémentaire, pas de volume de
  # données supplémentaire pour ce schéma — seulement un migrateur ponctuel
  # (client psql) et un worker qui s'y connecte par le réseau.
  # ─────────────────────────────────────────────────────────────────────

  migrator-ingestion-control:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    depends_on:
      pgvector:
        condition: service_healthy
    environment:
      PGHOST: pgvector
      PGPORT: "5432"
      PGDATABASE: ${PGVECTOR_DB:-ragdb}
      # Rôle superutilisateur de bootstrap de `pgvector` (même identifiants
      # que ce service, jamais dupliqués) : seul habilité CREATEROLE, requis
      # par provision_ingestion_control_roles.sh — jamais utilisé comme rôle
      # runtime (cf. ce script, qui crée deux rôles dédiés séparés).
      PGUSER: ${PGVECTOR_USER:-raguser}
      PGPASSWORD: "${PGVECTOR_PASSWORD:?PGVECTOR_PASSWORD requis}"
      INGESTION_CONTROL_MIGRATOR_PASSWORD: "${INGESTION_CONTROL_MIGRATOR_PASSWORD:?INGESTION_CONTROL_MIGRATOR_PASSWORD requis}"
      INGESTION_CONTROL_APP_PASSWORD: "${INGESTION_CONTROL_APP_PASSWORD:?INGESTION_CONTROL_APP_PASSWORD requis}"
    volumes:
      - ./postgres/ingestion_control/migrations:/infra/postgres/ingestion_control/migrations:ro
      - ./scripts/bootstrap_ingestion_control_schema.sh:/infra/scripts/bootstrap_ingestion_control_schema.sh:ro
      - ./scripts/provision_ingestion_control_roles.sh:/infra/scripts/provision_ingestion_control_roles.sh:ro
      - ./scripts/provision_and_bootstrap_ingestion_control.sh:/infra/scripts/provision_and_bootstrap_ingestion_control.sh:ro
    entrypoint: ["/infra/scripts/provision_and_bootstrap_ingestion_control.sh"]
    networks: [rag_net]
    # Tâche ponctuelle (bootstrap + provisioning des rôles), jamais un
    # service de longue durée — ne redémarre jamais seul ; `ingestion-worker`
    # attend explicitement sa complétion réussie (service_completed_successfully).
    restart: "no"
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  ingestion-worker:
    build:
      context: ../../..
      dockerfile: services/rag-engine/infra/Dockerfile.ingestion-worker
    restart: unless-stopped
    depends_on:
      migrator-ingestion-control:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-UTC}
      # DSN complet du rôle runtime `ingestion_control_app` (fourni tel
      # quel, jamais recomposé depuis des champs séparés dans ce fichier —
      # même convention que PG_RAG_DSN/PG_REVIEW_DSN ci-dessus).
      PG_INGESTION_CONTROL_DSN: "${PG_INGESTION_CONTROL_DSN:?PG_INGESTION_CONTROL_DSN requis (role ingestion_control_app)}"
      INGESTION_WORKER_OWNER: ${INGESTION_WORKER_OWNER:-ingestion-worker}
      INGESTION_WORKER_POLL_INTERVAL_S: ${INGESTION_WORKER_POLL_INTERVAL_S:-5}
      XDG_CACHE_HOME: /tmp
    volumes:
      # Profils/manifest gouvernés (LOT44c) : lecture seule, jamais créés
      # ni approuvés par ce fichier — leur absence fait échouer le gate au
      # démarrage (fail-closed), comportement voulu tant qu'aucun profil
      # approuvé n'existe réellement sur l'hôte.
      - ${RAG_INGESTION_PROFILES_HOST_DIR:-./configs/ingestion_profiles}:/app/configs/ingestion_profiles:ro
      - ${RAG_INGESTION_MANIFEST_HOST_PATH:-./configs/ingestion_manifest.yml}:/app/configs/ingestion_manifest.yml:ro
      - rag_ingestion_artifacts_data:/app/data/artifacts
    command:
      - python
      - -m
      - ingestion_worker.cli
      - --profiles-dir=/app/configs/ingestion_profiles
      - --manifest-path=/app/configs/ingestion_manifest.yml
      - --artifact-store-dir=/app/data/artifacts
      - --owner=${INGESTION_WORKER_OWNER:-ingestion-worker}
      - --poll-interval-s=${INGESTION_WORKER_POLL_INTERVAL_S:-5}
      - --heartbeat-file=/tmp/ingestion-worker.heartbeat
    networks: [rag_net]
    # Aucun bloc `ports:` — ce service n'est et ne doit jamais être exposé,
    # ni publiquement ni même en loopback (ADR-0024, ADR-0031). Seul un
    # opérateur via `docker exec ... python -m ingestion_worker.create_job_cli`
    # depuis l'hôte y accède ; aucune interface réseau entrante.
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import pathlib,sys,time; p=pathlib.Path('/tmp/ingestion-worker.heartbeat'); sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime < 60 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
