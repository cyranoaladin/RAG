networks:
  rag_net:
    driver: bridge
    # Pas de bloc `ipam` : le sous-réseau est auto-alloué par Docker.
    #
    # Un pin `10.30.0.0/24` a été introduit le 27/08/2026 pour corriger une
    # plage publique (173.30.0.0/24) observée sur un réseau Docker réel — mais
    # cette plage ne venait pas d'ici. Elle était déclarée par une surcharge
    # Compose conservée dans /tmp, perdue depuis, et n'affectait que le projet
    # `infra`. Ce fichier n'a jamais épinglé de sous-réseau.
    #
    # Le pin n'a donc corrigé aucun défaut réel, et en a créé un : la pile
    # canonique tournant sur son réseau auto-alloué, tout `up -d` détectait la
    # dérive et recréait le réseau — donc arrêtait toute la pile (constaté par
    # `docker compose up -d --dry-run`). Retiré (ADR-0051).
    #
    # La garantie recherchée — jamais de plage publique — est portée par
    # tests/test_v2_runtime_surface.py::test_compose_never_pins_a_public_subnet,
    # qui ne coûte aucune recréation. Le durcissement de l'auto-allocation
    # relève de `default-address-pools` dans /etc/docker/daemon.json : dette
    # documentée, cf. docs/reports/lot_dette_infra_rag_20260827.md.

volumes:
  rag_pgvector_data:
  rag_prometheus_data:
  rag_alertmanager_data:

services:
  pgvector:
    image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGVECTOR_DB:-ragdb}
      POSTGRES_USER: ${PGVECTOR_USER:-raguser}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:?PGVECTOR_PASSWORD requis}
      PGVECTOR_RETRIEVAL_USER: ${PGVECTOR_RETRIEVAL_USER:-rag_reader}
      PGVECTOR_RETRIEVAL_PASSWORD: ${PGVECTOR_RETRIEVAL_PASSWORD:?PGVECTOR_RETRIEVAL_PASSWORD requis}
      PGVECTOR_REVIEW_USER: ${PGVECTOR_REVIEW_USER:-rag_reviewer}
      PGVECTOR_REVIEW_PASSWORD: ${PGVECTOR_REVIEW_PASSWORD:?PGVECTOR_REVIEW_PASSWORD requis}
      PGVECTOR_PUBLISHER_USER: ${PGVECTOR_PUBLISHER_USER:-rag_publisher}
      PGVECTOR_PUBLISHER_PASSWORD: ${PGVECTOR_PUBLISHER_PASSWORD:?PGVECTOR_PUBLISHER_PASSWORD requis}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - rag_pgvector_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ./postgres/migrations/003_profile_filtering.sql:/docker-entrypoint-initdb.d/01_003_profile_filtering.sql:ro
      - ./postgres/migrations/004_artifact_placements.sql:/docker-entrypoint-initdb.d/02_004_artifact_placements.sql:ro
      - ./postgres/register_bootstrap_migrations.sh:/docker-entrypoint-initdb.d/03_register_bootstrap_migrations.sh:ro
      - ./postgres/provision_runtime_roles.sh:/docker-entrypoint-initdb.d/04_provision_runtime_roles.sh:ro
      - ./postgres/migrations:/docker-entrypoint-migrations:ro
      - ./postgres/healthcheck.sh:/docker-entrypoint-healthcheck.sh:ro
      - ./scripts/lib/pgvector_migration_state.sh:/pgvector-migration-state.sh:ro
      - ./postgres/schema_head_004_fingerprints.env:/schema-head-004-fingerprints.env:ro
      - ./postgres/schema_head_004_columns.tsv:/schema-head-004-columns.tsv:ro
    ports:
      - "127.0.0.1:${PGVECTOR_PORT:-5435}:5432"
    networks: [rag_net]
    healthcheck:
      test: ["CMD", "bash", "/docker-entrypoint-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  ingestor:
    build:
      context: ../../..
      dockerfile: services/rag-engine/infra/Dockerfile.ingestor-v2
    restart: unless-stopped
    depends_on:
      pgvector:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      RAG_ENV: production
      RAG_ENGINE_CONFIG_DIR: /app/configs
      PG_RAG_DSN: "${PG_RAG_DSN:?PG_RAG_DSN requis (role SELECT)}"
      PG_REVIEW_DSN: "${PG_REVIEW_DSN:?PG_REVIEW_DSN requis (role review limite)}"
      PG_POOL_MIN_SIZE: "${PG_POOL_MIN_SIZE:-1}"
      PG_POOL_MAX_SIZE: "${PG_POOL_MAX_SIZE:-10}"
      PG_POOL_TIMEOUT_S: "${PG_POOL_TIMEOUT_S:-1.0}"
      PG_CONNECT_TIMEOUT_S: "${PG_CONNECT_TIMEOUT_S:-1}"
      PG_STATEMENT_TIMEOUT_MS: "${PG_STATEMENT_TIMEOUT_MS:-3000}"
      PG_LOCK_TIMEOUT_MS: "${PG_LOCK_TIMEOUT_MS:-500}"
      PG_DATABASE_BUDGET_MS: "${PG_DATABASE_BUDGET_MS:-6000}"
      EMBED_MODEL: intfloat/multilingual-e5-large
      EMBED_DIM: "1024"
      RAG_EMBEDDING_MODEL_CACHE_DIR: /models/e5-large
      RAG_EMBEDDING_MODEL_INVENTORY_SHA256: "${RAG_EMBEDDING_MODEL_INVENTORY_SHA256:?empreinte SHA-256 externe de l inventaire embedding requise}"
      RAG_MIGRATIONS_DIR: /app/migrations
      RAG_SCHEMA_HEAD_FINGERPRINTS: /app/schema_head_004_fingerprints.env
      RAG_SCHEMA_HEAD_COLUMNS: /app/schema_head_004_columns.tsv
      RAG_RERANKER_MODEL_CACHE_DIR: /models/reranker
      RAG_RERANKER_MODEL_INVENTORY_SHA256: "${RAG_RERANKER_MODEL_INVENTORY_SHA256:?empreinte SHA-256 externe de l inventaire reranker requise}"
      RERANK_CACHE_TTL: "${RERANK_CACHE_TTL:-300}"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      RAG_MIN_COLLECTION_SUBSTANCE_CHUNKS: "${RAG_MIN_COLLECTION_SUBSTANCE_CHUNKS:-1}"
      RAG_RELEASE_REGISTRY_PATH: /app/release/release-registry.json
      RAG_RELEASE_REGISTRY_SHA256: "${RAG_RELEASE_REGISTRY_SHA256:?empreinte SHA-256 externe du registre de releases requise}"
      RAG_BFF_SERVICE_TOKEN: "${RAG_BFF_SERVICE_TOKEN:?RAG_BFF_SERVICE_TOKEN requis}"
      NEXUS_INTERNAL_TOKEN_SECRET: "${NEXUS_INTERNAL_TOKEN_SECRET:?NEXUS_INTERNAL_TOKEN_SECRET requis}"
      NEXUS_INTERNAL_TOKEN_ISSUER: "${NEXUS_INTERNAL_TOKEN_ISSUER:?NEXUS_INTERNAL_TOKEN_ISSUER requis}"
      NEXUS_INTERNAL_TOKEN_AUDIENCE: "${NEXUS_INTERNAL_TOKEN_AUDIENCE:?NEXUS_INTERNAL_TOKEN_AUDIENCE requis}"
      NEXUS_SSO_ISSUER: "${NEXUS_SSO_ISSUER:?NEXUS_SSO_ISSUER requis}"
      NEXUS_SSO_AUDIENCE: "${NEXUS_SSO_AUDIENCE:?NEXUS_SSO_AUDIENCE requis}"
      METRICS_ENABLED: "${METRICS_ENABLED:-true}"
      XDG_CACHE_HOME: /tmp
      # Sans cela, torch dimensionne ses fils sur les 16 cœurs de l'hôte —
      # invisibles depuis le cgroup — et sur-souscrit les cœurs réellement
      # alloués. C'est une sur-souscription qui ralentit plus qu'elle n'accélère,
      # et elle ne se voit dans aucune métrique de conteneur.
      OMP_NUM_THREADS: "${INGESTOR_TORCH_THREADS:-8}"
      MKL_NUM_THREADS: "${INGESTOR_TORCH_THREADS:-8}"
      TORCH_NUM_THREADS: "${INGESTOR_TORCH_THREADS:-8}"
    volumes:
      - ${RAG_CONFIGS_HOST_DIR:-../configs}:/app/configs:ro
      - ${RAG_RELEASE_REGISTRY_HOST_DIR:-../../rag-pedago/data/releases/prerentree_2026_2027}:/app/release:ro
      - ${RAG_EMBEDDING_MODEL_ARTIFACT_HOST_DIR:-./data/.no-model-cache}:/models/e5-large:ro
      - ${RAG_RERANKER_MODEL_ARTIFACT_HOST_DIR:-./data/.no-model-cache}:/models/reranker:ro
    ports:
      - "127.0.0.1:${INGESTOR_PORT:-8001}:8001"
    networks: [rag_net]
    # Le registre Prometheus est process-local : un seul worker canonique.
    # La capacité se scale par réplicas derrière un agrégateur, pas par fork local.
    command: uvicorn api_v2:app --host 0.0.0.0 --port 8001 --workers 1
    read_only: true
    tmpfs: ["/tmp", "/app/.cache", "/var/tmp"]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          # 2,0 CPU était la cause d'une panne de service, pas un réglage prudent :
          # 18 collections sur 18 renvoyaient 503 à concurrence 1. Le rerank de
          # 50 paires y coûtait 5 597 ms, l'encodage 631 ms, pour un budget de
          # 6 000 ms — le refus était de l'arithmétique.
          #
          # Mesuré sur ce matériel, rerank de 50 paires : 2 CPU = 5 597 ms,
          # 4 threads = 2 045 ms, 8 threads = 1 438 ms, 16 threads = 2 533 ms.
          # 16 est PIRE que 8 : le poste porte six piles Docker et une charge
          # moyenne de 3,5 à 5,4 ; au-delà de huit fils la contention l'emporte
          # sur le parallélisme. Le plafond est donc à 8, par mesure et non par
          # prudence — « plus de cœurs » n'était pas la bonne réponse.
          cpus: "${INGESTOR_CPUS:-8.0}"
          memory: 8G
        # Le GPU décharge le rerank, étape dominante et cause du point de rupture
        # à concurrence 2 : 265 ms pour 50 paires contre 1 438 ms à 8 threads CPU,
        # mesuré sur ce matériel.
        #
        # CONTRAINTE DE VRAM — 4 Go seulement, dont 2,44 Go pour l'embedding.
        # SERVIR ET INGÉRER SIMULTANÉMENT SUR CE GPU ÉPUISERA LA VRAM. Les deux
        # opérations se séquencent, jamais ne se recouvrent. C'est le genre de
        # contrainte qu'on redécouvre en panne si elle n'est écrite nulle part.
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  prometheus:
    image: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    restart: unless-stopped
    # Aucune dépendance de démarrage sur `ingestor` : la supervision doit
    # observer précisément le cas où le moteur ne démarre pas. Attendre qu'il
    # soit sain avant de lancer Prometheus rendrait `RagEngineV2Down`
    # inobservable exactement quand elle est utile.
    depends_on:
      alertmanager:
        condition: service_started
    volumes:
      - ./prometheus/prometheus.v2.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules/rag-engine-v2.rules.yml:/etc/prometheus/rules/rag-engine-v2.rules.yml:ro
      - rag_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19091}:9090"
    networks: [rag_net]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  alertmanager:
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - rag_alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-19093}:9093"
    networks: [rag_net]
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
