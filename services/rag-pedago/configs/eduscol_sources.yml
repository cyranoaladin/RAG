# eduscol_sources.yml — LOT 28 (ADR-0016)
# Sources semences (seed URLs) pour l'agent d'ingestion continue EduscolAgent.
#
# Règles :
# - Seules les entrées `status: verified` sont fetchées en continu.
# - `status: to_verify` = URL plausible non encore confirmée : l'agent les
#   IGNORE jusqu'à bascule explicite. La validation est effectuée par AGENT
#   (agents/source_validator.py, ADR-0018 §6 + ADR-0019) ; la bascule reste
#   un changement de config soumis à PR.
# - Chaque entrée déclare sa collection cible : le routage est déterministe,
#   jamais déduit du contenu (droits résolus par provenance, ADR-0013).
# - Aucune URL /recherche/ ou /search/ (Disallow robots.txt eduscol).
# - crawl-delay eduscol : 10 s (robots.txt reel, User-agent: *) — applique par
#   l'agent via continuous_ingestion.yml > per_domain_delay.

policy_ref: continuous_ingestion_v1
rights_default: official_public_administrative   # droits a confirmer par provenance lors de la revue
human_review_required_default: true              # tout depot staging exige revue avant gate

sources:

