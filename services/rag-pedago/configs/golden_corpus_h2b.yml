# Every object in each boundary zone is authoritative for the control.
boundary_controls:
  - control_id: bnd_01_a_verifier_full_zone
    title: "Zone complète 80_A_VERIFIER"
    zone: "01_EDUSCOL_OFFICIEL/LYCEE/TRANSVERSAL_MULTI_NIVEAUX/80_A_VERIFIER/"
    expected_count_in_zone: 805
    expected_disposition: REVIEW_REQUIRED
    expected_currentness: a_verifier

  - control_id: bnd_02_transition_full_zone
    title: "Zone complète 20_TRANSITION_OU_ACTUEL"
    zone: "01_EDUSCOL_OFFICIEL/LYCEE/TRANSVERSAL_MULTI_NIVEAUX/20_TRANSITION_OU_ACTUEL/"
    expected_count_in_zone: 49
    expected_disposition: REVIEW_REQUIRED
    expected_currentness: transition

  - control_id: bnd_03_archive_full_zone
    title: "Zone complète 90_ARCHIVE_CATALOGUE"
    zone: "01_EDUSCOL_OFFICIEL/LYCEE/TRANSVERSAL_MULTI_NIVEAUX/90_ARCHIVE_CATALOGUE/"
    expected_count_in_zone: 19
    expected_disposition: ARCHIVE_ONLY
    expected_currentness: archive

# Absence is failure. Pattern and zone controls evaluate every match.
negative_controls:
  - control_id: neg_01_admin_manifest
    title: "SHA256SUMS.txt"
    path: "00_ADMIN/SHA256SUMS.txt"
    expected_count: 1
    expected_disposition: EXCLUDE

  - control_id: neg_02_guide_famille
    title: "Guide candidat individuel"
    filename_pattern: "Nexus_Reussite_Guide_Candidat_Individuel_*.pdf"
    expected_count: 1
    expected_disposition: EXCLUDE

  - control_id: neg_03_scan_blanc
    title: "Scan blanc non pédagogique"
    filename_pattern: "t_nexus_scan_blanc_non_pedagogique.pdf"
    expected_count: 1
    expected_disposition: EXCLUDE

  - control_id: neg_04_geogebra_full_zone
    title: "Zone complète des ressources GeoGebra"
    zone: "03_RESSOURCES_INTERACTIVES/"
    expected_count_in_zone: 37
    expected_disposition: UNSUPPORTED

