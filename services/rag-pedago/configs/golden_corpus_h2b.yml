# Test assertions
test_assertions:
  - assertion_id: assert_positive_ingest_eligible
    description: "All positive controls are INGEST eligible when gates pass"
    controls: [pos_01, pos_02, pos_03, pos_04, pos_05, pos_06]
    check: "disposition == INGEST && currentness == actuel"

  - assertion_id: assert_boundary_review_required
    description: "All boundary controls are REVIEW_REQUIRED or ARCHIVE_ONLY"
    controls: [bnd_01, bnd_02, bnd_03]
    check: "disposition in [REVIEW_REQUIRED, ARCHIVE_ONLY]"

  - assertion_id: assert_negative_excluded
    description: "All negative controls are EXCLUDE or UNSUPPORTED"
    controls: [neg_01, neg_02, neg_03, neg_04]
    check: "disposition in [EXCLUDE, UNSUPPORTED]"

  - assertion_id: assert_no_implicit_ingest
    description: "No document gets INGEST without passing all gates"
    check: "disposition == INGEST implies gates_all_pass"

