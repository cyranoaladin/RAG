     niveau_exact: [premiere], effective_from_school_year: "2026-2027"}
  - {matiere: danse, modality: SPECIALITE, authority_kind: LIMITATIVE_PROGRAM,
     niveau_exact: [terminale], effective_from_school_year: "2027-2028"}

