# Périmètre produit du GO-LIVE — déclaration canonique versionnée.
#
# Ce fichier ne décide rien : il transcrit, collection par collection, ce que
# les autorités de périmètre déjà versionnées du dépôt disent. Chaque classe
# cite sa source ; l'auditeur refuse toute collection du catalogue qui ne serait
# classée nulle part, et toute collection classée deux fois.
#
# Pourquoi ce fichier existe : le référentiel scolaire décrit le système
# éducatif français, pas le périmètre du produit. S'en servir comme autorité de
# périmètre conduit à surestimer ce que le GO-LIVE exige — c'est l'erreur que
# cette déclaration ferme.

protocol_version: NEXUS-GO-LIVE-SCOPE-V1
school_year: "2026-2027"

sources:
  roadmap_pilot: >-
    docs/ROADMAP.md, « Cadrage » : « Vertical pilote décidé : Candidat libre —
    Terminale générale, spécialités Maths + NSI (taxonomie déjà présente,
    corpus le plus mûr, expertise interne pour juger la qualité). Les autres
    niveaux/matières se déploient ensuite par réplication. »
  roadmap_phase5: >-
    docs/ROADMAP.md, Phase 5 « Mise à l'échelle » : « Déploiement des autres
    niveaux/matières et du track AEFE ». Postérieure au déploiement du vertical
    pilote, donc hors du périmètre exigé par le GO-LIVE initial.
  lot27_out_of_v1: >-
    docs/reports/lot_27_business_coverage_matrix.md, « Hors perimetre v1 (non
    declare) », repris par l'en-tête « Périmètre v1 (D-PERIMETRE-EXPLICITE) »
    de services/rag-engine/configs/rag_collections.yml.
  lot27_complete_coverage: >-
    docs/reports/lot_27_business_coverage_matrix.md, « LOT 28 requis —
    couverture pedagogique complete » : la cible de couverture disciplinaire,
    explicitement postérieure au pilote.
  adr_0015: >-
    docs/adr/ADR-0015-corpus-tous-niveaux.md : extension du catalogue à
    l'architecture cible. Déclarer une collection n'est pas la mettre au
    périmètre du GO-LIVE ; ADR-0015 §5 laisse les 24 nouvelles entrées
    instanciee=false en attente de vagues progressives.

