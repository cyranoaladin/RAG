rationale: >-
  L'ensemble éligible complet de la première release servable : 18 collections
  instanciées, portant chacune une autorité d'activation nommée (ADR-0039,
  ADR-0041, ADR-0049, H2-C, LOT-25a) et disposant d'un profil d'ingestion
  production activé. Les 18 collections couvrent 26 artefacts, 26 placements et
  730 chunks scellés par l'empreinte fe97b341... permettant la réconciliation
  exacte et le démarrage certifié du moteur.

