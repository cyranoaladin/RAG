# Membership de la FIRST_SERVABLE_RELEASE — déclaration explicite.
#
# Ce fichier ÉNUMÈRE les membres. Il ne les filtre pas.
#
# La distinction est le fond du lot : un producteur qui construirait la release
# par `if instanciee: include` ferait disparaître silencieusement toute
# collection dont le drapeau bascule, et ferait apparaître silencieusement
# toute collection nouvellement instanciée. Les deux sont inacceptables.
#
# Les deux invariants restent indépendants :
#
#     RELEASE_MEMBER  =>  INSTANCIEE          (imposé, fail-closed)
#     INSTANCIEE      =/=>  RELEASE_MEMBER    (l'appartenance reste choisie)
#
# Si un membre déclaré ici n'est pas instancié, le producteur ÉCHOUE. Il ne le
# retire jamais de lui-même : le désaccord doit être tranché par une décision,
# pas absorbé par un outil.
#
# ─────────────────────────────────────────────────────────────────────────
# CE JALON N'EST PAS LE GO-LIVE.
#
# `release_type: intermediate` et `go_live_complete: false` sont vérifiés par
# un test dédié, afin qu'aucun rapport futur ne puisse dériver
# « FIRST_SERVABLE_RELEASE = PASS  =>  GO_LIVE_READY = PASS ».
# Le périmètre obligatoire du GO-LIVE est fixé par ADR-0048 et vaut
# collège + lycée général + STMG.
# ─────────────────────────────────────────────────────────────────────────

protocol_version: NEXUS-RELEASE-MEMBERSHIP-V1
release_id: production-profile-gate-2026-2027-v1
release_name: FIRST_SERVABLE_RELEASE
release_type: intermediate
go_live_complete: false
