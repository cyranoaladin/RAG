schema_version: 1
subject: nsi
programme_version: BOEN_special_8_2019-07-25
collection: rag_nexus_nsi_terminale_specialite
queries:
  - id: nsi_positive_listes_comprehension
    category: positive
    notion: listes
    intent: comprehension
    text: "Dans une liste chaînée, quel rôle jouent la tête, les maillons et la référence vers le maillon suivant, et comment reconnaît-on une liste vide ?"
    filters: &nsi_filters
      tenant: libre_terminale
      level: terminale
      track: generale
      teaching_status: specialite
      audience: libre
      candidates: [cned_libre, individuel, libre]
      subject: nsi
      collection: rag_nexus_nsi_terminale_specialite
      school_year: 2026-2027
    expected:
      outcome: answer
      official_program_reference: &nsi_programme "BOEN spécial n° 8 du 25 juillet 2019 — programme de NSI de terminale générale"
      pedagogical_expectation: "Décrire précisément la structure récursive d'une liste chaînée, le cas vide et l'accès au maillon suivant."
      candidate_source_class: "Cours de programme NSI sur les listes chaînées"
      must_not_return: []
  - id: nsi_positive_listes_methode
    category: positive
    notion: listes
    intent: methode
    text: "Quelle méthode permet d'insérer un élément en tête d'une liste chaînée puis de parcourir tous ses éléments sans perdre de maillon ?"
    filters: *nsi_filters
    expected:
      outcome: answer
      official_program_reference: *nsi_programme
      pedagogical_expectation: "Présenter les mises à jour de références dans le bon ordre et une boucle de parcours qui s'arrête sur la liste vide."
      candidate_source_class: "Fiche méthodologique et pseudocode sur les listes"
      must_not_return: []
  - id: nsi_positive_listes_application
    category: positive
    notion: listes
    intent: application
    text: "Une playlist doit permettre des insertions fréquentes entre deux chansons : comment la modéliser par une liste chaînée et réaliser une insertion locale ?"
    filters: *nsi_filters
    expected:
      outcome: answer
      official_program_reference: *nsi_programme
      pedagogical_expectation: "Relier le besoin d'insertion locale au chaînage et expliciter les deux références à modifier."
