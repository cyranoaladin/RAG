[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-release-chain"
version = "0.1.0"
description = "Nexus shared release chain, ingestion profiles, readiness and chunking"
authors = [{ name = "Nexus Team" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "nexus-contracts>=0.15.0",
]

# La pile PDF est un EXTRA, pas une dépendance du coeur.
#
# Mesuré : `release_readiness.py` n'importe que la bibliothèque standard, et
# `__init__.py` n'importe rien. Seul `pdf_extractor.py` a besoin de
# `nexus-pdf-page-policy`, donc de `pypdf`. La déclarer obligatoire imposait un
# parseur au runtime de LECTURE, dont l'allowlist est volontairement sans
# parseur — et c'est précisément ce qui avait rendu nécessaire une copie
# vendorée du module dans le service.
#
# `pip install nexus-release-chain`        → coeur, sans pypdf
# `pip install "nexus-release-chain[pdf]"` → capacité PDF
[project.optional-dependencies]
pdf = ["nexus-pdf-page-policy>=1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

# Le paquet est intégralement annoté ; sans ce marqueur, mypy refuse de
# l'analyser chez ses consommateurs et leur impose de désactiver le contrôle
# sur l'autorité la plus importante qu'ils importent.
[tool.setuptools.package-data]
nexus_release_chain = ["py.typed"]
