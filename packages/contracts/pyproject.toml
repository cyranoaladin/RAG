[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-contracts"
version = "0.13.0"
description = "Shared retrieval contract for the Nexus RAG platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    # ADR-0035 : vérification hors ligne des reçus de liaison de revue
    # (Ed25519). Les surfaces globales d'autorisation l'importent désormais
    # depuis le package public ; tout consommateur des schémas installe donc
    # le package et ses dépendances déclarées, sans liste CI parallèle.
    "cryptography==49.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.19",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexus_contracts = ["artifacts/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
