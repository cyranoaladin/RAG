name: CI — Nexus RAG Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: "packages/contracts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e 'packages/contracts[dev]'
      - run: python -m pytest packages/contracts/tests -q
      - run: python packages/contracts/scripts/export_schemas.py --output packages/contracts/schema --check

  pdf-page-policy:
    name: "packages/pdf-page-policy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "packages/pdf-page-policy[dev]"
      - run: python -c "import nexus_pdf_page_policy as p; print(p.POLICY_ID)"
      - working-directory: packages/pdf-page-policy
        run: python -m pytest -q tests

  qualification-scripts:
    name: "scripts/qualification"
    runs-on: ubuntu-latest
    # Le workflow C1 refuse de tourner sur `pull_request` — à raison : il porte
    # la clé du corpus privé, qu'un job de PR non revu pourrait exfiltrer. Mais
    # ses épreuves UNITAIRES n'ont besoin d'aucun secret, et ne tournaient donc
    # nulle part avant la fusion : une PR pouvait casser le producteur de
    # l'ensemble promu sans que rien ne le dise avant `main`.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Le qualificateur consomme l'autorité canonique de release, celle que
      # le runtime utilise. L'installer coûte une ligne ; la dupliquer coûtait
      # onze rondes de revue et un second runtime à maintenir.
      - run: pip install --quiet pytest -e packages/release-chain
      - run: python -m pytest -q scripts/qualification/tests
      # Le producteur ne lit que des données publiques du dépôt : il doit
      # rendre l'ensemble promu ici, sans clé, ou nommer ce qui est faux.
      - run: |
          python scripts/qualification/compute_promoted_content_set.py \
            --output /tmp/promoted-content-set.json

  rag-pedago:
    name: "services/rag-pedago"
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          # The production placement tests replay from their recorded source
          # tree, which can be an earlier commit in this PR branch.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: services/rag-pedago
        run: make install
      - working-directory: services/rag-pedago
        run: make lint
      - working-directory: services/rag-pedago
        run: make typecheck
      - working-directory: services/rag-pedago
        run: make test
      - working-directory: services/rag-pedago
        run: make source-evidence-check

  rag-engine:
    name: "services/rag-engine"
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: services/rag-engine
        run: make install
      - working-directory: services/rag-engine
        run: make lint
      - working-directory: services/rag-engine
        run: make typecheck
      - working-directory: services/rag-engine
        run: make test
      - working-directory: services/rag-engine
        run: make test-integration-hybrid

  worker-image-integration:
    # Les cinq suites d'intégration qui exigent un démon Docker RÉEL : elles
    # construisent l'image du worker, la lancent, montent leurs propres
    # conteneurs PostgreSQL/pgvector et exercent `docker compose`.
    #
    # Aucun autre job ne les couvrait : `make test` les exclut
    # (`-m "not integration"`), `test-governance-pg` a un périmètre nommé qui
    # ne les contient pas, et `test-integration-hybrid` n'en prend que deux
    # autres. Elles ne s'exécutaient donc NULLE PART en CI — et un poste de
    # développement contraint n'est pas une autorité pour un gate go-live.
    name: "worker image integration (docker)"
    runs-on: ubuntu-latest
    needs: contracts
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require a real Docker daemon
        working-directory: services/rag-engine
        run: bash infra/scripts/require_docker.sh
      - name: Snapshot containers before
        run: docker ps -aq | sort > /tmp/containers-before.txt
      - working-directory: services/rag-engine
        run: make install
      - name: Worker image and runtime integration suites
        working-directory: services/rag-engine
        env:
          NEXUS_REQUIRE_DOCKER: "1"
        run: |
          PYTHONPATH=src .venv/bin/pytest -q -rfE \
            tests/integration/test_lot41a_docker_authority_e2e.py \
            tests/integration/test_lot41a_worker_enforcement.py \
            tests/integration/test_lot44f_ingestion_up_failure.py \
            tests/integration/test_lot44f_worker_attestation.py \
            tests/integration/test_lot44f_worker_resume.py
      - name: Assert no test container survived
        if: always()
        # `comm -13` ne signale que les conteneurs AJOUTÉS. `diff` signalait
        # aussi les disparitions : sur un runner qui n'est pas vierge, un test
        # supprimant légitimement un conteneur préexistant faisait échouer le
        # job alors que rien n'avait fui. Même motif que `governance postgres`
        # dans ce fichier, et pour la même raison.
        run: |
          set -euo pipefail
          docker ps -aq | sort > /tmp/containers-after.txt
          leftover="$(comm -13 /tmp/containers-before.txt /tmp/containers-after.txt)"
          if [ -n "$leftover" ]; then
            echo "::error::residual containers created by this job" >&2
            echo "$leftover" | xargs -r docker rm -f
            exit 1
          fi

  access-authority:
    # C5 — l'autorité d'accès est le placement, jamais une colonne
    # dénormalisée. `rag_chunks.visibility` et `rag_chunks.audience` sont des
    # colonnes héritées, peuplées à la publication et donc susceptibles d'être
    # PÉRIMÉES : si l'une d'elles pouvait décider de ce qui est servi, une
    # simple ligne non rafraîchie élargirait la portée d'un contenu.
    #
    # Les épreuves exercent le prédicat que le moteur LIVRE, sur un PostgreSQL
    # jetable — jamais une copie du SQL réécrite pour le test, jamais la base
    # servie.
    name: "access authority (C5)"
    runs-on: ubuntu-latest
    services:
      pgvector:
        image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
        env:
          POSTGRES_PASSWORD: c5-qualification-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: services/rag-engine
        run: make install
      - name: Prove the placement authority cannot be overridden
        working-directory: services/rag-engine
        env:
          NEXUS_C5_PG_DSN: "postgresql://postgres:c5-qualification-only@localhost:5432/postgres"
        run: |
          PYTHONPATH=src .venv/bin/pytest -q -rfE \
            tests/integration/test_c5_placement_is_the_access_authority.py

  real-model-acceptance:
    name: "real-model acceptance (E5 + reranker + pgvector)"
    runs-on: ubuntu-latest
    needs: contracts
    timeout-minutes: 30
    # LOT H2-B remédiation (finding P2-real-model-ci-coverage) : distinct de
    # "rag-engine" (CI code rapide, tests réels exclus via `-m "not
    # integration"`). Ce job matérialise les VRAIS modèles E5/reranker à
    # des révisions HuggingFace épinglées (jamais "latest"), les vérifie
    # par inventaire SHA-256, puis exécute une acceptance minimale contre
    # un VRAI pgvector éphémère (service container ci-dessous, même image
    # que docker-compose.v2.yml). Portée honnête, documentée dans
    # docs/reports/h2_exact_head_remediation_pre_go_live.md : real E5
    # encode + real reranker rerank + real vectors round-trip through
    # pgvector — jamais l'ingestion complète du corpus propriétaire (PDF
    # non commités, hors de portée d'un runner hosted).
    env:
      EMBEDDING_MODEL_REVISION: 3d7cfbdacd47fdda877c5cd8a79fbcc4f2a574f3
      RERANKER_MODEL_REVISION: 233902d25c440f23af6f7d6e94d2946bac0bee0a
    services:
      pgvector:
        image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
        env:
          POSTGRES_DB: real_model_acceptance
          POSTGRES_USER: real_model_acceptance
          POSTGRES_PASSWORD: real-model-acceptance-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U real_model_acceptance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: services/rag-engine
        run: make install
      - name: Cache real embedding model artifact
        id: cache-e5
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/model-cache/e5-large
          key: real-model-e5-large-${{ env.EMBEDDING_MODEL_REVISION }}
      - name: Cache real reranker model artifact
        id: cache-reranker
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/model-cache/reranker
          key: real-model-reranker-${{ env.RERANKER_MODEL_REVISION }}
      - name: Prepare embedding model artifact (cache miss only)
        if: steps.cache-e5.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          source services/rag-engine/.venv/bin/activate
          MODEL_ARTIFACT_DIR="${{ runner.temp }}/model-cache/e5-large" \
          EMBEDDING_MODEL_REVISION="${{ env.EMBEDDING_MODEL_REVISION }}" \
          bash scripts/e2e/prepare-embedding-model-artifact.sh
      - name: Prepare reranker model artifact (cache miss only)
        if: steps.cache-reranker.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          source services/rag-engine/.venv/bin/activate
          MODEL_ARTIFACT_DIR="${{ runner.temp }}/model-cache/reranker" \
          RERANKER_MODEL_REVISION="${{ env.RERANKER_MODEL_REVISION }}" \
          bash scripts/e2e/prepare-reranker-model-artifact.sh
      - name: Fail closed if a cached artifact is missing its inventory
        run: |
          set -euo pipefail
          test -f "${{ runner.temp }}/model-cache/e5-large/SHA256SUMS"
          test -f "${{ runner.temp }}/model-cache/reranker/SHA256SUMS"
      - name: Compute model inventory digests
        id: digests
        run: |
          set -euo pipefail
          echo "e5_sha256=$(sha256sum "${{ runner.temp }}/model-cache/e5-large/SHA256SUMS" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "reranker_sha256=$(sha256sum "${{ runner.temp }}/model-cache/reranker/SHA256SUMS" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Real-model acceptance (E5 + reranker + pgvector)
        working-directory: services/rag-engine
        env:
          RAG_EMBEDDING_MODEL_CACHE_DIR: ${{ runner.temp }}/model-cache/e5-large
          RAG_EMBEDDING_MODEL_INVENTORY_SHA256: ${{ steps.digests.outputs.e5_sha256 }}
          RAG_RERANKER_MODEL_CACHE_DIR: ${{ runner.temp }}/model-cache/reranker
          RAG_RERANKER_MODEL_INVENTORY_SHA256: ${{ steps.digests.outputs.reranker_sha256 }}
          NEXUS_REAL_MODEL_PGVECTOR_DSN: "postgresql://real_model_acceptance:real-model-acceptance-ci-only@localhost:5432/real_model_acceptance"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          PYTHONPATH=src .venv/bin/pytest tests/integration/test_real_model_ci_acceptance.py -v

  governance-postgres:
    name: "governance postgres"
    runs-on: ubuntu-latest
    needs: contracts
    # G2 : les invariants gouvernés (migration 013, LOT42-V2, attribution
    # H2-F, rollbacks fail-closed, sérialisation writer/attestor) ne sont
    # prouvables que sur un vrai PostgreSQL. Sans ce job, ils n'étaient
    # protégés contre régression par aucun check.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: services/rag-engine
        run: make install-dev
      # Chaque suite démarre son propre conteneur jetable depuis une image
      # épinglée par digest, avec des credentials générés par run. Aucune
      # base partagée, aucun secret, aucun service externe.
      # Inventaire AVANT : le garde-fou compare, il ne suppose pas que le
      # runner est vierge. Un filtre par préfixe de nom serait fragile (il
      # dépendrait des labels internes des harnais) et capterait des
      # conteneurs sans rapport.
      # Préflight visible : si Docker manque, la cause apparaît dans les
      # logs GitHub avant toute exécution de pytest, plutôt qu'au travers
      # d'une erreur de collecte. Le script est partagé avec la cible Make,
      # de sorte que CI et poste local refusent avec le même message.
      - name: Require a real Docker daemon
        working-directory: services/rag-engine
        run: bash infra/scripts/require_docker.sh
      - name: Snapshot containers before
        run: docker ps -aq | sort > /tmp/containers-before.txt
      - working-directory: services/rag-engine
        run: make test-governance-pg
      - name: Assert no test container survived
        if: always()
        run: |
          set -euo pipefail
          docker ps -aq | sort > /tmp/containers-after.txt
          leftover="$(comm -13 /tmp/containers-before.txt /tmp/containers-after.txt)"
          if [ -n "$leftover" ]; then
            echo "residual containers created by this job:" >&2
            docker ps -a --filter "id=$(echo "$leftover" | tr '\n' ' ' | sed 's/ /" --filter "id=/g')" >&2 || true
            echo "$leftover" | xargs -r docker rm -f
            exit 1
          fi

  cockpit:
    name: "services/cockpit"
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: services/cockpit/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e packages/contracts
      - working-directory: services/cockpit
        run: npm ci
      - working-directory: services/cockpit
        run: npm run lint
      - working-directory: services/cockpit
        run: npm test -- --run
      - working-directory: services/cockpit
        run: npm run build
      - working-directory: services/cockpit
        run: npm audit
      - working-directory: services/cockpit
        run: npm audit --omit=dev
      - run: python3 scripts/tests/test-cockpit-snapshot-coherence.py
      - run: bash scripts/tests/test-cockpit-clean-build.sh

  repository-controls:
    name: "repository controls"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install PyYAML==6.0.3
      - run: bash scripts/check-repository-hygiene.sh
      - run: YAML_PYTHON_BIN=python bash scripts/tests/test-repository-hygiene.sh
      - run: bash scripts/tests/test-ci-local-topology.sh
      - run: python scripts/tests/test-main-protection-policy.py
      - run: python scripts/tests/test-trusted-human-review.py
      - run: python scripts/tests/test-trusted-human-review-github.py
      - run: python scripts/tests/test-trusted-human-review-workflow.py
      - run: YAML_PYTHON_BIN=python NEXUS_CI_LOCAL_RUNNING=1 bash scripts/tests/test-ci-local-failsafe.sh

  governance-locks:
    name: "governance locks guard"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: bash scripts/check-governance-locks.sh
