name: CI — Nexus RAG Platform

on:
  push:
    branches: [main, "lot-*", "lot-*/**"]
  pull_request:
    branches: [main, "lot-*", "lot-*/**"]

jobs:
  contracts:
    name: "packages/contracts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e packages/contracts
      - run: python -c "from nexus_contracts import RetrievalRequest, StudentProfile; print('OK')"

  rag-pedago:
    name: "services/rag-pedago"
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: services/rag-pedago
        run: make install
      - working-directory: services/rag-pedago
        run: make lint
      - working-directory: services/rag-pedago
        run: make typecheck
      - working-directory: services/rag-pedago
        run: make test
      - working-directory: services/rag-pedago
        run: make source-evidence-check

  rag-engine:
    name: "services/rag-engine"
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: services/rag-engine
        run: make install
      - working-directory: services/rag-engine
        run: make lint
      - working-directory: services/rag-engine
        run: make typecheck
      - working-directory: services/rag-engine
        run: make test

  cockpit:
    name: "services/cockpit"
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: services/cockpit/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install PyYAML==6.0.3 pydantic==2.13.4
      - working-directory: services/cockpit
        run: npm ci
      - working-directory: services/cockpit
        run: npm run lint
      - working-directory: services/cockpit
        run: npm test -- --run
      - working-directory: services/cockpit
        run: npm run build
      - working-directory: services/cockpit
        run: npm audit
      - working-directory: services/cockpit
        run: npm audit --omit=dev
      - run: python3 scripts/tests/test-cockpit-snapshot-coherence.py
      - run: bash scripts/tests/test-cockpit-clean-build.sh

  governance-locks:
    name: "governance locks guard"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: bash scripts/check-governance-locks.sh

  repository-hygiene:
    name: "repository hygiene"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if find . -maxdepth 1 -type f \( -name 'MANIFEST_LOT*.md' -o -name '*.tar.gz' \) -print -quit | grep -q .; then
            echo "Un manifeste de lot ou une archive est interdit à la racine." >&2
            exit 1
          fi

  full-regression:
    name: "full regression"
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: services/cockpit/package-lock.json
      - name: Préparer les environnements hors de la porte hermétique
        run: |
          python -m venv packages/contracts/.venv
          packages/contracts/.venv/bin/pip install -e "packages/contracts[dev]"
          make -C services/rag-pedago install
          make -C services/rag-engine install
          npm --prefix services/cockpit ci
      - name: Exécuter la porte hermétique
        run: make full-regression
