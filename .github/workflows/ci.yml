name: CI — Nexus RAG Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: "packages/contracts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e packages/contracts
      - run: python -c "from nexus_contracts import RetrievalRequest, StudentProfile; print('OK')"

  rag-pedago:
    name: "services/rag-pedago"
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: services/rag-pedago
        run: make install
      - working-directory: services/rag-pedago
        run: make lint
      - working-directory: services/rag-pedago
        run: make typecheck
      - working-directory: services/rag-pedago
        run: make test
      - working-directory: services/rag-pedago
        run: make source-evidence-check

  rag-engine:
    name: "services/rag-engine"
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: services/rag-engine
        run: make install
      - working-directory: services/rag-engine
        run: make lint
      - working-directory: services/rag-engine
        run: make typecheck
      - working-directory: services/rag-engine
        run: make test
      - working-directory: services/rag-engine
        run: make test-integration-hybrid

  governance-postgres:
    name: "governance postgres"
    runs-on: ubuntu-latest
    needs: contracts
    # G2 : les invariants gouvernés (migration 013, LOT42-V2, attribution
    # H2-F, rollbacks fail-closed, sérialisation writer/attestor) ne sont
    # prouvables que sur un vrai PostgreSQL. Sans ce job, ils n'étaient
    # protégés contre régression par aucun check.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: services/rag-engine
        run: make install-dev
      # Chaque suite démarre son propre conteneur jetable depuis une image
      # épinglée par digest, avec des credentials générés par run. Aucune
      # base partagée, aucun secret, aucun service externe.
      # Inventaire AVANT : le garde-fou compare, il ne suppose pas que le
      # runner est vierge. Un filtre par préfixe de nom serait fragile (il
      # dépendrait des labels internes des harnais) et capterait des
      # conteneurs sans rapport.
      # Préflight visible : si Docker manque, la cause apparaît dans les
      # logs GitHub avant toute exécution de pytest, plutôt qu'au travers
      # d'une erreur de collecte. Le script est partagé avec la cible Make,
      # de sorte que CI et poste local refusent avec le même message.
      - name: Require a real Docker daemon
        working-directory: services/rag-engine
        run: bash infra/scripts/require_docker.sh
      - name: Snapshot containers before
        run: docker ps -aq | sort > /tmp/containers-before.txt
      - working-directory: services/rag-engine
        run: make test-governance-pg
      - name: Assert no test container survived
        if: always()
        run: |
          set -euo pipefail
          docker ps -aq | sort > /tmp/containers-after.txt
          leftover="$(comm -13 /tmp/containers-before.txt /tmp/containers-after.txt)"
          if [ -n "$leftover" ]; then
            echo "residual containers created by this job:" >&2
            docker ps -a --filter "id=$(echo "$leftover" | tr '\n' ' ' | sed 's/ /" --filter "id=/g')" >&2 || true
            echo "$leftover" | xargs -r docker rm -f
            exit 1
          fi

  cockpit:
    name: "services/cockpit"
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: services/cockpit/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install PyYAML==6.0.3 pydantic==2.13.4
      - working-directory: services/cockpit
        run: npm ci
      - working-directory: services/cockpit
        run: npm run lint
      - working-directory: services/cockpit
        run: npm test -- --run
      - working-directory: services/cockpit
        run: npm run build
      - working-directory: services/cockpit
        run: npm audit
      - working-directory: services/cockpit
        run: npm audit --omit=dev
      - run: python3 scripts/tests/test-cockpit-snapshot-coherence.py
      - run: bash scripts/tests/test-cockpit-clean-build.sh

  repository-controls:
    name: "repository controls"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install PyYAML==6.0.3
      - run: bash scripts/check-repository-hygiene.sh
      - run: YAML_PYTHON_BIN=python bash scripts/tests/test-repository-hygiene.sh
      - run: bash scripts/tests/test-ci-local-topology.sh
      - run: python scripts/tests/test-main-protection-policy.py
      - run: python scripts/tests/test-trusted-human-review.py
      - run: python scripts/tests/test-trusted-human-review-github.py
      - run: python scripts/tests/test-trusted-human-review-workflow.py
      - run: YAML_PYTHON_BIN=python NEXUS_CI_LOCAL_RUNNING=1 bash scripts/tests/test-ci-local-failsafe.sh

  governance-locks:
    name: "governance locks guard"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: bash scripts/check-governance-locks.sh
