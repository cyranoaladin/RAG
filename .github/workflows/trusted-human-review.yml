name: Trusted human review

"on":
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: trusted-human-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate trusted human review
    if: ${{ github.event_name != 'issue_comment' || (github.event.issue.pull_request != null && github.event.comment.body == '/nexus-trusted-review') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      # Résout PR_NUMBER/EXPECTED_HEAD en sortie de step -- un run
      # déclenché par `issue_comment` n'a pas de `head_sha` naturel côté
      # GitHub (contrairement à `pull_request_target`), donc le check-run
      # IMPLICITE que GitHub Actions crée pour ce job s'attache par
      # défaut au tip de `main` au moment du déclenchement, jamais au
      # head réel de la PR commentée. Corrigé ci-dessous en publiant un
      # Commit Status explicite, épinglé au vrai head via l'API Statuses
      # -- le check-run implicite (mal épinglé côté SHA pour
      # `issue_comment`) reste inoffensif mais ne doit jamais être
      # l'unique source de vérité.
      - name: Resolve PR scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Invalid pull request number"
            exit 2
          }
          if [[ -z "$EXPECTED_HEAD" ]]; then
            PR_SCOPE="$(
              gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
                --jq '[.base.ref, .head.sha] | @tsv'
            )"
            IFS=$'\t' read -r OBSERVED_BASE_REF EXPECTED_HEAD <<<"$PR_SCOPE"
            [[ "$OBSERVED_BASE_REF" == "main" ]] || {
              echo "::notice::PR hors main ignorée"
              echo "in_scope=false" >>"$GITHUB_OUTPUT"
              exit 0
            }
          fi
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid expected head SHA"
            exit 2
          }
          {
            echo "in_scope=true"
            echo "pr_number=$PR_NUMBER"
            echo "expected_head=$EXPECTED_HEAD"
          } >>"$GITHUB_OUTPUT"

      - name: Evaluate trusted review
        id: evaluate
        if: steps.scope.outputs.in_scope == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/github/trusted_human_review_github.py \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request "${{ steps.scope.outputs.pr_number }}" \
            --expected-head "${{ steps.scope.outputs.expected_head }}" \
            --check

      # Commit Status explicite, épinglé au VRAI head via l'API Statuses --
      # jamais dépendant de la résolution implicite de SHA de GitHub
      # Actions pour un événement `issue_comment`. Toujours publié
      # (`if: always()`), y compris quand l'étape précédente a été
      # sautée (PR hors scope) ou a échoué.
      #
      # Remplace un check-run explicite (API Checks) utilisé jusqu'au
      # 2026-08-15 : celui-ci s'est révélé peu fiable comme required
      # status check -- un check-run ajouté par un déclenchement
      # `issue_comment` ultérieur rejoint le check_suite déjà `completed`
      # de la toute première évaluation pour ce head_sha, dont le rollup
      # ne se rafraîchit jamais ; la branch-protection GitHub, qui
      # s'appuie sur ce rollup, continue de rapporter le required check
      # comme "expected" même quand le check-run individuel est bien
      # `success` (confirmé sur PR#116 : merge bloqué malgré un
      # check-run `success` fraîchement republié -- voir
      # docs/reports/trusted_review_head_drift_incident_20260815.md et
      # docs/reports/trusted_review_branch_protection_rehearsal_20260815.md).
      # L'API Statuses n'a pas cette notion de suite/rollup : chaque
      # POST est un enregistrement plat, immédiatement pris en compte --
      # confirmé par rehearsal isolé (reconnaissance en moins de 10s).
      - name: Publish head-pinned trusted-review status
        if: always() && steps.scope.outputs.in_scope == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ steps.scope.outputs.expected_head }}
          OUTCOME: ${{ steps.evaluate.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" == "success" ]]; then
            state=success
          else
            state=failure
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_HEAD" \
            -f state="$state" \
            -f context="trusted-human-review/head-pinned" \
            -f description="Trusted human review evaluation: $state" \
            -f target_url="$RUN_URL" \
            >/dev/null

      - name: Fail the job if the review was not approved
        if: steps.scope.outputs.in_scope == 'true' && steps.evaluate.outcome != 'success'
        run: |
          echo "::error::trusted review evaluation did not approve this head — see the 'Evaluate trusted review' step log above"
          exit 1
