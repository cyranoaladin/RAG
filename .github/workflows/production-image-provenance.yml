name: Production image provenance

# ADR-0036 (chaîne de promotion gouvernée), phase B. Construit et pousse
# les images applicatives de production (jamais construites sur l'hôte
# cible) et publie un inventaire signé-par-provenance-GitHub
# (NEXUS-DEPLOYMENT-IMAGE-INVENTORY-V1) qu'un opérateur/outil hors ligne
# revérifie ensuite avant de signer un ProductionReadinessManifest.
#
# Ne signe RIEN : la clé prod-readiness-v1-2026-08-13 reste offline, sous
# contrôle propriétaire (ADR-0036 §5/§10). Ce workflow ne produit que des
# faits vérifiables ; le signer les consomme séparément.
#
# Ne déploie RIEN : build + push seulement. BUILD/PUSH != DEPLOY.

on:
  workflow_dispatch:
    inputs:
      public_candidate:
        description: "Produire l'inventaire V2 incluant le Cockpit public (V1 reste le défaut)"
        required: false
        type: boolean
        default: false
      cuda_ingestor:
        description: "Construire l'API CUDA pour le candidat public (nécessite public_candidate)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: production-image-provenance-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}
  PLATFORM: linux/amd64

jobs:
  build-and-push:
    name: Build and push production images
    runs-on: ubuntu-latest
    # Jamais de `if:` au niveau du job ici : un `if:` de job qui échoue
    # produit un statut `skipped`, jamais `failure` -- un dispatch sur la
    # mauvaise ref apparaîtrait alors vert (job "skipped"), jamais rouge,
    # et l'étape de refus explicite ci-dessous n'aurait jamais l'occasion
    # de s'exécuter (le job entier serait sauté avant elle). Le refus
    # fail-closed vit uniquement dans cette première étape, qui échoue
    # réellement (`exit 1`) -- même défaut trouvé et corrigé dans
    # promote.yml, PR #110, corrigé ici à l'identique.
    steps:
      - name: Refuse anything but a real main commit
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::this workflow only ever runs against refs/heads/main, got ${{ github.ref }}"
          exit 1

      - name: Refuse CUDA outside the public candidate
        if: inputs.cuda_ingestor == true && inputs.public_candidate != true
        run: |
          echo "::error::cuda_ingestor requires public_candidate"
          exit 1

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve source identity
        id: source
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse "HEAD^{tree}")"
          if [ "$commit_sha" != "${{ github.sha }}" ]; then
            echo "::error::checked-out HEAD ($commit_sha) does not match github.sha (${{ github.sha }})"
            exit 1
          fi
          {
            echo "commit_sha=$commit_sha"
            echo "tree_sha=$tree_sha"
          } >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Dockerfile digests (evidence, not build inputs)
        id: dockerfiles
        run: |
          set -euo pipefail
          ingestor_dockerfile=services/rag-engine/infra/Dockerfile.ingestor-v2
          if [ "${{ inputs.cuda_ingestor }}" = true ]; then
            ingestor_dockerfile=services/rag-engine/infra/Dockerfile.ingestor-v2.cuda
          fi
          {
            echo "ingestor_dockerfile_sha256=$(sha256sum "$ingestor_dockerfile" | cut -d' ' -f1)"
            echo "worker_dockerfile_sha256=$(sha256sum services/rag-engine/infra/Dockerfile.multilevel-worker-production | cut -d' ' -f1)"
          } >>"$GITHUB_OUTPUT"
          if [ "${{ inputs.public_candidate }}" = true ]; then
            echo "cockpit_dockerfile_sha256=$(sha256sum services/cockpit/Dockerfile | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
          fi

      # ── ingestor (API v2 / plan de données) ──────────────────────────────
      - name: Build and push ingestor
        id: build_ingestor
        if: inputs.cuda_ingestor != true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/rag-engine/infra/Dockerfile.ingestor-v2
          platforms: ${{ env.PLATFORM }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/rag-ingestor:sha-${{ steps.source.outputs.commit_sha }}

      - name: Build and push CUDA ingestor
        id: build_ingestor_cuda
        if: inputs.cuda_ingestor == true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/rag-engine/infra/Dockerfile.ingestor-v2.cuda
          platforms: ${{ env.PLATFORM }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/rag-ingestor:sha-${{ steps.source.outputs.commit_sha }}-cuda

      # ── multilevel-worker-production (Worker A ET Worker B partagent
      # exactement le même contexte/Dockerfile/plateforme — un seul build,
      # deux services qui le référencent, relation gardée explicite dans
      # l'inventaire ci-dessous plutôt que supposée) ───────────────────────
      - name: Build and push multilevel-worker-production
        id: build_worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/rag-engine/infra/Dockerfile.multilevel-worker-production
          platforms: ${{ env.PLATFORM }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/rag-multilevel-worker-production:sha-${{ steps.source.outputs.commit_sha }}

      - name: Build and push cockpit
        id: build_cockpit
        if: inputs.public_candidate == true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/cockpit/Dockerfile
          platforms: ${{ env.PLATFORM }}
          build-args: SOURCE_COMMIT_SHA=${{ steps.source.outputs.commit_sha }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/rag-cockpit:sha-${{ steps.source.outputs.commit_sha }}

      - name: Assemble exact image inventory
        id: inventory
        env:
          PUBLIC_CANDIDATE: ${{ inputs.public_candidate && 'true' || 'false' }}
          CUDA_INGESTOR: ${{ inputs.cuda_ingestor && 'true' || 'false' }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT_SHA: ${{ steps.source.outputs.commit_sha }}
          SOURCE_TREE_SHA: ${{ steps.source.outputs.tree_sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          INGESTOR_DIGEST: ${{ inputs.cuda_ingestor && steps.build_ingestor_cuda.outputs.digest || steps.build_ingestor.outputs.digest }}
          INGESTOR_DOCKERFILE_SHA256: ${{ steps.dockerfiles.outputs.ingestor_dockerfile_sha256 }}
          WORKER_DIGEST: ${{ steps.build_worker.outputs.digest }}
          WORKER_DOCKERFILE_SHA256: ${{ steps.dockerfiles.outputs.worker_dockerfile_sha256 }}
          COCKPIT_DIGEST: ${{ steps.build_cockpit.outputs.digest }}
          COCKPIT_DOCKERFILE_SHA256: ${{ steps.dockerfiles.outputs.cockpit_dockerfile_sha256 }}
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import UTC, datetime

          namespace = os.environ["IMAGE_NAMESPACE"]
          public_candidate = os.environ["PUBLIC_CANDIDATE"]
          if public_candidate not in {"true", "false"}:
              raise SystemExit("public_candidate must be an explicit boolean")
          public_candidate = public_candidate == "true"
          cuda_ingestor = os.environ["CUDA_INGESTOR"]
          if cuda_ingestor not in {"true", "false"}:
              raise SystemExit("cuda_ingestor must be an explicit boolean")
          cuda_ingestor = cuda_ingestor == "true"
          if cuda_ingestor and not public_candidate:
              raise SystemExit("cuda_ingestor requires public_candidate")
          document = {
              "protocol_version": (
                  "NEXUS-DEPLOYMENT-IMAGE-INVENTORY-V2" if public_candidate
                  else "NEXUS-DEPLOYMENT-IMAGE-INVENTORY-V1"
              ),
              "repository": os.environ["REPOSITORY"],
              "source_commit_sha": os.environ["SOURCE_COMMIT_SHA"],
              "source_tree_sha": os.environ["SOURCE_TREE_SHA"],
              "platform": "linux/amd64",
              "workflow_path": ".github/workflows/production-image-provenance.yml",
              "workflow_run_id": int(os.environ["WORKFLOW_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["WORKFLOW_RUN_ATTEMPT"]),
              "workflow_ref": "refs/heads/main",
              "built_at": datetime.now(UTC).isoformat().replace("+00:00", "Z"),
              "services": {
                  "ingestor": {
                      "source_kind": "build",
                      "build_context": ".",
                      "dockerfile": (
                          "services/rag-engine/infra/Dockerfile.ingestor-v2.cuda"
                          if cuda_ingestor else "services/rag-engine/infra/Dockerfile.ingestor-v2"
                      ),
                      "dockerfile_sha256": os.environ["INGESTOR_DOCKERFILE_SHA256"],
                      "image_repository": f"{namespace}/rag-ingestor",
                      "image_digest": os.environ["INGESTOR_DIGEST"],
                  },
                  "multilevel-worker-a-production": {
                      "source_kind": "build",
                      "build_context": ".",
                      "dockerfile": "services/rag-engine/infra/Dockerfile.multilevel-worker-production",
                      "dockerfile_sha256": os.environ["WORKER_DOCKERFILE_SHA256"],
                      "image_repository": f"{namespace}/rag-multilevel-worker-production",
                      "image_digest": os.environ["WORKER_DIGEST"],
                  },
                  "multilevel-worker-b-production": {
                      "source_kind": "build",
                      "build_context": ".",
                      "dockerfile": "services/rag-engine/infra/Dockerfile.multilevel-worker-production",
                      "dockerfile_sha256": os.environ["WORKER_DOCKERFILE_SHA256"],
                      "image_repository": f"{namespace}/rag-multilevel-worker-production",
                      "image_digest": os.environ["WORKER_DIGEST"],
                  },
              },
          }
          if public_candidate:
              document["services"]["cockpit"] = {
                  "source_kind": "build",
                  "build_context": ".",
                  "dockerfile": "services/cockpit/Dockerfile",
                  "dockerfile_sha256": os.environ["COCKPIT_DOCKERFILE_SHA256"],
                  "image_repository": f"{namespace}/rag-cockpit",
                  "image_digest": os.environ["COCKPIT_DIGEST"],
              }
          for name, service in document["services"].items():
              if not service["image_digest"] or not service["image_digest"].startswith("sha256:"):
                  raise SystemExit(f"service {name!r}: build-push-action produced no digest")

          filename = (
              "nexus-public-deployment-image-inventory-v2.json" if public_candidate
              else "nexus-deployment-image-inventory.json"
          )
          with open(filename, "w", encoding="utf-8") as handle:
              json.dump(document, handle, sort_keys=True, indent=2)
              handle.write("\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"inventory_file={filename}\n")
          print(json.dumps(document, sort_keys=True, indent=2))
          PY

      - name: Upload image inventory artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.public_candidate && 'nexus-public-deployment-image-inventory-v2' || 'nexus-deployment-image-inventory' }}
          path: ${{ steps.inventory.outputs.inventory_file }}
          retention-days: 90
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Production image provenance"
            echo ""
            echo '```json'
            cat "${{ steps.inventory.outputs.inventory_file }}"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
