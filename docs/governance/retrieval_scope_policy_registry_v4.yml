# Registre gouverné des politiques de scope de retrieval — profils production,
# release V4 (`production-profile-gate-2026-2027-v4`).
#
# CE FICHIER NE CRÉE AUCUN DROIT, ET NE PREND AUCUNE DÉCISION NOUVELLE.
#
# Il est le successeur, pour la release V4, de
# `docs/governance/retrieval_scope_policy_registry.yml` (release V2), qui reste
# inchangé et historique. Toute valeur de POLITIQUE portée ici — tenant,
# niveau, voie, matière, statut d'enseignement, candidat, audiences, droits,
# `policy_visibility`, `programme_version`, identité cible, statut et source
# d'autorité — est IDENTIQUE à celle du registre V2, collection par
# collection. Un test
# (`packages/contracts/tests/test_retrieval_scope_policy_registry_v4.py`)
# refuse toute divergence : ce fichier ne peut que RELIER les décisions déjà
# prises (ADR-0045, ADR-0052, ADR-0053) aux subjects de la release V4.
#
# Ce qui change, et seulement cela :
#
#   * la release liée (identifiant, manifeste, digest) et l'autorité de
#     programme qu'elle embarque ;
#   * `subject_manifest_sha256` de chaque collection, lu dans le manifeste V4 ;
#   * `evidence_visibility`, qui est un FAIT de la release et non une
#     politique : les placements V4 déclarent `internal` (ADR-0061). La règle
#     d'ADR-0052 §3 s'applique toujours — `policy_visibility=internal` n'élargit
#     pas `evidence_visibility=internal` ;
#   * pour les trois décisions humaines, l'évidence d'admissibilité recomptée
#     sur la release V4 (`currentness=official_snapshot`, ADR-0059).
#
# `corpus_provenance_id` reste l'identifiant de corpus d'origine ; il n'est
# jamais une référence de programme.

registry_kind: NEXUS_RETRIEVAL_SCOPE_POLICY_REGISTRY_V1
registry_version: "1"
school_year: "2026-2027"

# Registre dont ce fichier reprend les décisions, sans en prendre aucune.
predecessor_registry_path: docs/governance/retrieval_scope_policy_registry.yml

# Release dont ce registre couvre les collections. Le registre ne la modifie
# pas et n'en dérive aucune dimension d'autorisation.
release_id: production-profile-gate-2026-2027-v4
release_manifest_path: services/rag-pedago/data/releases/prerentree_2026_2027/profile_gate_v4/release-024f8625ebfeb7ce/profile_gate/production-profile-gate.release.json
release_manifest_sha256: bab9c398f59eb8b0f2f5324ed28536525b37052ba075a4b5547e851b38cda4be

# ADR-0052 §2 — autorité du `programme_version` de politique : le registre de
# programme EMBARQUÉ par la release V4.
programme_version_authority:
  authority_kind: NEXUS_PROGRAMME_INDEX_REGISTRY_V3
  path: services/rag-pedago/data/releases/prerentree_2026_2027/profile_gate_v4/release-024f8625ebfeb7ce/profile_gate/programme_registry.json
  sha256: 67c91d6b0840864bf4750ef236a0c2f8cfb11804022fcf0ee70cbfd58320ee97

# ADR-0052 §3 — ordre de restriction de la visibilité. Un indice supérieur
# restreint DAVANTAGE. Une politique peut restreindre par rapport à l'évidence ;
# elle ne peut jamais élargir sans ADR explicite.
visibility_restriction_order:
  - public
  - internal
  - restricted
  - private

