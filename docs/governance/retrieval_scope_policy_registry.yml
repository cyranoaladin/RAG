# Registre gouverné des politiques de scope de retrieval — profils production.
#
# CE FICHIER NE CRÉE AUCUN DROIT.
#
# Il RESTITUE, collection par collection, la politique d'autorisation déjà
# décidée ailleurs, en nommant sa source. Toute valeur de politique portée ici
# est reprise d'un scope `prod_*_v1` packagé dans le registre fermé de
# `nexus_contracts`, gouverné sous ADR-0045. Un test
# (`packages/contracts/tests/test_retrieval_scope_policy_registry.py`) refuse
# toute valeur qui divergerait de sa source : ce fichier ne peut donc pas
# inventer un droit, seulement en citer un.
#
# Les collections sans politique sourcée sont déclarées BLOQUANTES. Elles ne
# reçoivent aucune valeur par défaut, aucune valeur « par analogie » avec une
# collection voisine, et aucun scope ne peut être émis pour elles.
#
# Décidé par : ADR-0052 (dimensions de cross-check) et ADR-0053 (autorité des
# droits HGGSP/HLP).

registry_kind: NEXUS_RETRIEVAL_SCOPE_POLICY_REGISTRY_V1
registry_version: "1"
school_year: "2026-2027"

# Release dont ce registre couvre les collections. Le registre ne la modifie
# pas et n'en dérive aucune dimension d'autorisation.
release_id: production-profile-gate-2026-2027-v2
release_manifest_path: services/rag-pedago/data/releases/prerentree_2026_2027/profile_gate_v2/release-1b9eba0c0eb0ab13/profile_gate/production-profile-gate.release.json
release_manifest_sha256: e9506f5a66edec1f54f5a91935b5d3a9ba54c5c47abc040e93c02f278395d864

# ADR-0052 §2 — autorité du `programme_version` de politique. La référence de
# programme officielle se lit ICI, jamais dans les placements de subject (qui
# portent un identifiant de corpus, cf. `corpus_provenance_id`).
programme_version_authority:
  authority_kind: NEXUS_PROGRAMME_INDEX_REGISTRY_V3
  path: services/rag-pedago/data/releases/prerentree_2026_2027/profile_gate_v2/release-1b9eba0c0eb0ab13/profile_gate/programme_registry.json
  sha256: 67c91d6b0840864bf4750ef236a0c2f8cfb11804022fcf0ee70cbfd58320ee97

# ADR-0052 §3 — ordre de restriction de la visibilité. Un indice supérieur
# restreint DAVANTAGE. Une politique peut restreindre par rapport à l'évidence ;
# elle ne peut jamais élargir sans ADR explicite.
visibility_restriction_order:
  - public
  - internal
  - restricted
  - private

