release_and_gate:
  public_candidate_manifest_media_type: text/plain
  public_candidate_manifest_pdf_allowed: false
  approved_derivatives_only_in_new_public_successor_release: true
  source_pdf_visibility: internal
  historical_counts_must_not_be_preserved_artificially: true
  public_collections_required: 11
  empty_collection_servability_claim_allowed: false
