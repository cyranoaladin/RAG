  observed_at_utc: '2026-10-09T20:48:58Z'
  scope: eduscol_pages_and_downloadable_documents_excluding_third_party_material
  terms_snapshot_sha256_required: true
  third_party_exceptions:
    - logo
    - pictogram
    - thumbnail
    - infographic
    - photograph
    - video
    - audio
    - text_excerpt
  attribution_required: [source_uri, source_label, source_last_updated_at_utc, page_start, page_end]
  attribution_must_not_imply_official_endorsement: true

full_document_scan:
  exact_bytes_match_required: true
  size_match_required: true
  page_count_match_required: true
  all_pages_text_extracted: true
  scanned_or_nontext_pages_ocr_required: true
  all_pages_with_graphics_rendered: true
  page_text_and_render_sha256_required: true
  embedded_pdf_scan_evidence_required: true
  scanner_code_sha256_binding_required: true
  covers: [cover, body, footer, images, metadata, attachments, annexes]
  annexes_scan_complete_required: true
  incomplete_or_unreadable_disposition: EXCLUDE
  raw_pii_in_evidence_allowed: false
  chain_of_thought_in_evidence_allowed: false

source_verification:
  source_uri_must_identify_exact_pdf: true
  final_uri_http_status_observed_at_utc_required: true
  etag_and_last_modified_record_when_present: true
  source_bytes_match_when_downloadable: true
  rights_terms_applicability_required: true
  source_currentness_required: true
  revocation_check_required: true
  network_or_source_unverifiable_disposition: EXCLUDE

reviewers:
  independent_contexts_required: true
  identities_models_prompts_and_parameters_pinned: true
  zero_temperature_when_supported: true
  reviewer_a_domain: rights_license_restrictions_third_party_currentness_revocation
  reviewer_b_domain: student_suitability_pii_images_annexes_teacher_only_answer_keys
  approved_candidate_repetitions: 2
  disagreement_or_low_confidence_disposition: EXCLUDE
  missing_reviewer_or_page_disposition: EXCLUDE
  free_text_model_decision_authoritative: false

approve_public_requires_true:
  - exact_bytes_match
  - full_document_scan_complete
  - annexes_scan_complete
  - explicit_rights_basis_present
  - reuse_scope_covers_student_retrieval_excerpt
  - source_exact_document_match
  - pii_gate_pass
  - currentness_gate_pass
  - revocation_gate_pass
  - student_suitability_pass
approve_public_requires_false:
  - restrictive_notice_detected
  - teacher_only_detected
  - non_disclosure_instruction_detected
  - unlicensed_third_party_content_detected
approve_public_requires_rights_basis_in:
  - NEXUS_FIRST_PARTY_OWNED_WITH_REGISTRY_PROOF
  - EXPLICIT_OPEN_LICENSE_WITH_EXACT_NOTICE
  - EXPLICIT_REUSE_TERMS_COVERING_THE_AUTHORIZED_USE
  - PUBLIC_DOMAIN_OR_EQUIVALENT_WITH_VERIFIABLE_BASIS
approve_public_requires_reviewer_verdict: PASS
deterministic_policy_verdict_is_output_only: true
approve_public_additional_evidence_gates:
  - source_terms_verified
  - source_last_updated_verified
  - citation_attribution_complete
  - candidate_repetitions_identical

decisions:
  allowed: [APPROVE_PUBLIC, EXCLUDE, REPLACE_WITH_NEW_CONTENT]
  pending_allowed: false
  default: EXCLUDE
  replace_with_new_content_requires:
    - distinct_new_content_sha256
    - preexisting_verified_substitute_rights_basis
    - full_new_artifact_pipeline_pass
  preserve_old_sha_approval_after_modification: false
  cftr:
    content_sha256: 3f1ab328a0c11f40a0abf85dccdf29dc17d80159dc01bee189a10017d0fbd3e6
    final_disposition: EXCLUDE
    student_suitability: FAIL
    reason_code: TEACHER_NON_DISCLOSURE_INSTRUCTION
    evidence_page: 3

release_and_gate:
  approved_content_only_in_new_public_successor_release: true
  historical_counts_must_not_be_preserved_artificially: true
  per_artifact_evidence_schema: governance/student_public_rights/schemas/automated_artifact_review_v1.schema.json
  decision_sheet_must_be_generated: true
  independent_verifier_required: true
  sabotage_tests_required: true
