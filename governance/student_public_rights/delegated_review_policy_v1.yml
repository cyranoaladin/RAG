    - PUBLIC_DOMAIN_OR_EQUIVALENT_WITH_VERIFIABLE_BASIS
  other_explicitly_verified_basis_enabled: false
  insufficient_signals:
    - PUBLICLY_ACCESSIBLE
    - OFFICIAL_DOMAIN
    - EDUSCOL_SOURCE_ONLY
    - LEGACY_OFFICIEL_PUBLIC
    - ALREADY_IN_CORPUS
    - ALREADY_INDEXED
